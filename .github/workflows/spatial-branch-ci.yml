name: Spatial branch CI

on:
  push:
    branches:
      - redesign/spatial-3d-research-2026

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: research-website/package-lock.json
      - name: Refresh lockfile metadata without lifecycle scripts
        working-directory: research-website
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile drift if needed
        shell: bash
        run: |
          if ! git diff --quiet -- research-website/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-website/package-lock.json
            git commit -m "chore: refresh spatial dependency lockfile"
            git push origin HEAD:redesign/spatial-3d-research-2026
          fi
      - name: Install exact dependencies
        working-directory: research-website
        run: npm ci --ignore-scripts
      - name: Run spatial tests
        working-directory: research-website
        run: npm test --if-present
      - name: Build website
        working-directory: research-website
        run: npm run build
