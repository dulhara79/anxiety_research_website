name: Research website CI

on:
  push:
    branches:
      - redesign/research-instrument-2026
  pull_request:
    paths:
      - 'research-website/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: research-website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
