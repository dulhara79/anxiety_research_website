name: Refresh research assets from Drive
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'dulhara79/anxiety_research_website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh Drive metadata
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON" || { echo 'Configure GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON in repository secrets'; exit 1; }
          cd research-website
          npm run drive:sync
      - name: Commit updated assets only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-website/src/data/driveAssets.generated.js
          if git diff --cached --quiet; then echo "No Drive changes"; exit 0; fi
          git commit -m "chore: refresh images and presentation from Drive"
          git push
