name: Particle cleanup CI

on:
  push:
    branches:
      - redesign/spatial-3d-research-2026

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: research-website/package-lock.json
      - name: Install dependencies
        working-directory: research-website
        run: npm ci --ignore-scripts
      - name: Run tests
        working-directory: research-website
        run: npm test --if-present
      - name: Run validator
        working-directory: research-website
        run: npm run validate
      - name: Build
        working-directory: research-website
        run: npm run build
